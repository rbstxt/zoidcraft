[workspace]
resolver = "3"
members = [
    "crates/zc-time",
    "crates/zc-geom",
    "crates/zc-color",
    "crates/zc-anim",
    "crates/zc-expr",
    "crates/zc-plugin",
    "crates/zc-project",
    "crates/zc-scene",
    "crates/zc-shader",
    "crates/zc-render",
    "crates/zc-audio",
    "crates/zc-export",
    "crates/zc-session",
    "apps/zoidcraft",
    "apps/zoidcraft-cli",
    "xtask",
]
default-members = [
    "crates/*",
    "apps/*",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/rbstxt/zoidcraft"

[workspace.dependencies]
# Workspace crates
zc-time = { path = "crates/zc-time" }
zc-geom = { path = "crates/zc-geom" }
zc-color = { path = "crates/zc-color" }
zc-anim = { path = "crates/zc-anim" }
zc-expr = { path = "crates/zc-expr" }
zc-plugin = { path = "crates/zc-plugin" }
zc-project = { path = "crates/zc-project" }
zc-scene = { path = "crates/zc-scene" }
zc-shader = { path = "crates/zc-shader" }
zc-render = { path = "crates/zc-render" }
zc-audio = { path = "crates/zc-audio" }
zc-export = { path = "crates/zc-export" }
zc-session = { path = "crates/zc-session" }

# Core / math / serialization
glam = { version = "0.34", features = ["serde", "bytemuck"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.29", features = ["v4", "serde"] }
bytemuck = { version = "1.25", features = ["derive"] }
flate2 = "1.1"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }

# Graphics / shaders / fonts / images
wgpu = "30.0"
naga = { version = "30.0", features = ["glsl-in", "wgsl-out", "wgsl-in"] }
pollster = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ttf-parser = "0.25"
lyon_tessellation = "1.0"

# Audio
symphonia = { version = "0.6", default-features = false, features = ["mp3", "pcm", "wav", "ogg", "vorbis", "aac", "isomp4", "flac"] }
cpal = "0.18"

# Desktop UI (L5 apps/zoidcraft ONLY; forbidden in crates/*)
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui-wgpu = "0.37"
rfd = "0.18"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep memory usage low on 8GB machines during development builds.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
