[package]
name = "zoidcraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zoidcraft"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
zc-geom = { workspace = true }
zc-color = { workspace = true }
zc-anim = { workspace = true }
zc-expr = { workspace = true }
zc-plugin = { workspace = true }
zc-project = { workspace = true }
zc-scene = { workspace = true }
zc-shader = { workspace = true }
zc-render = { workspace = true }
zc-audio = { workspace = true }
zc-export = { workspace = true }
zc-session = { workspace = true }
serde_json = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
wgpu = { workspace = true }
tracing = { workspace = true }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }
rfd = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }
web-time = { workspace = true }
