name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-14
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          - name: macOS-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
          - name: Windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip
          - name: Linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} --bin zoidcraft --bin zoidcraft-cli
      - name: Package tar.gz (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGE="zoidcraft-${{ matrix.name }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/zoidcraft" "$STAGE/"
          cp "target/${{ matrix.target }}/release/zoidcraft-cli" "$STAGE/"
          cp LICENSE README.md "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
      - name: Package zip (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "zoidcraft-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/zoidcraft.exe" "$stage/"
          Copy-Item "target/${{ matrix.target }}/release/zoidcraft-cli.exe" "$stage/"
          Copy-Item LICENSE, README.md "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "${stage}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: zoidcraft-${{ matrix.name }}
          path: |
            zoidcraft-*.tar.gz
            zoidcraft-*.zip

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum zoidcraft-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/zoidcraft-*
            artifacts/SHA256SUMS.txt
