<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d1d1d">
    <title>ZoidCraft</title>
    <link rel="icon" type="image/png" href="./icons/zoidcraft-256.png?v=__ZC_BUILD_ID__">
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #1d1d1d; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        #loading { position: fixed; inset: 0; display: grid; place-content: center; padding: 24px;
            text-align: center; background: #1d1d1d; color: #f2f2f2; font-family: system-ui, sans-serif; }
        #loading[hidden] { display: none; }
        #loading img { width: 72px; height: 72px; margin: 0 auto 16px; }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
        p { max-width: 34rem; margin: 10px auto 0; color: #c0c0c0; font-size: .9rem; line-height: 1.5; }
        #error { color: #ffb4a8; overflow-wrap: anywhere; }
        #update-banner { position: fixed; top: 12px; right: 12px; z-index: 20; display: flex; align-items: center;
            gap: 10px; max-width: calc(100vw - 24px); padding: 8px 10px 8px 12px; border-radius: 8px;
            background: #222222; border: 1px solid #4a88ff; color: #f2f2f2;
            font: 500 0.8125rem/1.35 system-ui, sans-serif; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45); }
        #update-banner[hidden] { display: none; }
        #update-banner-text { color: #e8e8e8; }
        .update-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        #update-banner button { appearance: none; border-radius: 5px; padding: 4px 10px;
            font: 600 0.75rem/1.3 system-ui, sans-serif; cursor: pointer; }
        #update-reload { background: #4a88ff; border: 1px solid #4a88ff; color: #ffffff; }
        #update-reload:hover { background: #5c95ff; border-color: #5c95ff; }
        #update-dismiss { background: #1d1d1d; border: 1px solid #3c3c3c; color: #cfcfcf; }
        #update-dismiss:hover { background: #2b2b2b; color: #f2f2f2; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "mp4box": "./vendor/mp4box.js?v=__ZC_BUILD_ID__",
                "mp4-muxer": "./vendor/mp4-muxer.js?v=__ZC_BUILD_ID__",
                "webm-muxer": "./vendor/webm-muxer.js?v=__ZC_BUILD_ID__",
                "fflate": "./vendor/fflate.js?v=__ZC_BUILD_ID__"
            }
        }
    </script>
</head>
<body>
    <canvas id="zoidcraft_canvas" aria-label="ZoidCraft editor"></canvas>
    <div id="loading" role="status">
        <img src="./icons/zoidcraft-256.png?v=__ZC_BUILD_ID__" alt="">
        <h1>ZoidCraft</h1>
        <p id="status">Checking browser graphics and video support…</p>
        <p id="error" hidden></p>
        <noscript><p>Enable JavaScript to open the ZoidCraft editor.</p></noscript>
    </div>
    <div id="update-banner" role="status" aria-live="polite" hidden>
        <span id="update-banner-text"></span>
        <div class="update-actions">
            <button id="update-reload" type="button">Reload</button>
            <button id="update-dismiss" type="button">Dismiss</button>
        </div>
    </div>
    <script type="module">
        const status = document.querySelector("#status");
        const error = document.querySelector("#error");
        const loading = document.querySelector("#loading");
        const updateBanner = document.querySelector("#update-banner");
        const updateBannerText = document.querySelector("#update-banner-text");
        const updateReload = document.querySelector("#update-reload");
        const updateDismiss = document.querySelector("#update-dismiss");
        const canvasId = "zoidcraft_canvas";
        const version = "__ZC_BUILD_ID__";

        function supportsWebGl2() {
            try {
                const context = document.createElement("canvas").getContext("webgl2");
                context?.getExtension("WEBGL_lose_context")?.loseContext();
                return !!context;
            } catch {
                return false;
            }
        }

        try {
            const webGl = supportsWebGl2();
            if (!navigator.gpu && !webGl) {
                throw new Error("This browser could not start WebGPU or WebGL2. Enable hardware acceleration and reload.");
            }
            await import(`./zc_web_runtime.js?v=${version}`);
            const codecs = globalThis.__zcWebCodecs.isSupported() ? "WebCodecs available" : "WebCodecs unavailable";
            const graphics = navigator.gpu ? "WebGPU" : "WebGL2";
            status.textContent = `Starting ${graphics} · ${codecs}`;
            const { default: init, start_zoidcraft_web } = await import(`./pkg/zoidcraft.js?v=${version}`);
            await init({ module_or_path: `./pkg/zoidcraft_bg.wasm?v=${version}` });
            try {
                await start_zoidcraft_web(canvasId, !navigator.gpu);
            } catch (gpuError) {
                if (!navigator.gpu || !webGl) throw gpuError;
                status.textContent = `Starting WebGL2 · ${codecs}`;
                // Browsers only allow one type of graphics context per canvas.
                const canvas = document.getElementById(canvasId);
                canvas.replaceWith(canvas.cloneNode(false));
                await start_zoidcraft_web(canvasId, true);
            }
            loading.hidden = true;

            let pendingUpdate = null;
            const updateMonitor = globalThis.__zcWebUpdate.createWebUpdateMonitor({
                currentBuildId: version,
                async fetchVersion() {
                    const response = await fetch(`./version.json?t=${Date.now()}`, { cache: "no-store" });
                    if (!response.ok) return null;
                    return await response.json();
                },
                onUpdate(update) {
                    pendingUpdate = update;
                    updateBannerText.textContent = update.version
                        ? `ZoidCraft v${update.version} is available`
                        : "A new version of ZoidCraft is available";
                    updateBanner.hidden = false;
                },
            });
            updateReload.addEventListener("click", () => {
                window.location.reload();
            });
            updateDismiss.addEventListener("click", () => {
                if (pendingUpdate) updateMonitor.dismiss(pendingUpdate.buildId);
                updateBanner.hidden = true;
            });
            updateMonitor.start();
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") void updateMonitor.checkNow();
            });
        } catch (failure) {
            status.textContent = "Could not start the editor.";
            error.textContent = failure?.message ?? String(failure);
            error.hidden = false;
        }
    </script>
</body>
</html>
